<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dwmy Spatial Planner</title>
    <meta name="description" content="Dwmy - Spatial calendar and personal planner with realistic environmental background, floating frosted glass window, multi-plane layering, ambient lighting, and clean flat orientation." />
    
    <!-- React 18 & ReactDOM -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for in-browser JSX compilation without Node/build step -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              'royal-maison': ["'royal-maison'", "'Royal Maison'", 'cursive', 'sans-serif'],
              'signatie': ["'signatie'", "'Signatie'", 'cursive', 'sans-serif'],
              'bitteva': ["'bitteva-script'", "'Bitteva Script'", 'cursive', 'sans-serif'],
              'halimun': ["'Halimun'", "'halimun'", 'cursive', 'sans-serif'],
              'fraunces': ["'Fraunces'", 'Georgia', 'serif'],
              'mono': ["'IBM Plex Mono'", 'monospace'],
              'sans': ["'Inter'", '-apple-system', 'BlinkMacSystemFont', "'Segoe UI'", 'Roboto', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap');

        font-family: 'royal-maison';

             url('./public/fonts/RoyalMaisonScript.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Royal Maison';
        src: url('./fonts/RoyalMaisonScript.ttf') format('truetype'),
             url('./public/fonts/RoyalMaisonScript.ttf') format('truetype');

        font-display: swap;
      }
      @font-face {
        font-family: 'royal-maison-serif';

             url('./public/fonts/RoyalMaisonSerif.ttf') format('truetype');

        font-display: swap;
      }
      @font-face {
        font-family: 'signatie';

      }

        font-family: 'bitteva-script';

             url('./public/fonts/BittevaScript.ttf') format('truetype');

        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'halimun';
        src: url('./fonts/Halimun.ttf') format('truetype'),
             url('./public/fonts/Halimun.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Halimun';
        src: url('./fonts/Halimun.ttf') format('truetype'),
             url('./public/fonts/Halimun.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #0b0e11;
        color: #ede7d8;
        overflow-x: hidden;

      }

      }

        background: rgba(255, 255, 255, 0.02);

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {

      }

      .hide-native-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
        scrollbar-color: transparent transparent;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }
      .hide-native-scrollbar::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

      // --- SVG ICONS ---
      const IconBase = ({ size = 15, strokeWidth = 2, className = '', style, children, viewBox = '0 0 24 24' }) => (
        <svg
          width={size}
          height={size}
          viewBox={viewBox}
          fill="none"
          stroke="currentColor"
          strokeWidth={strokeWidth}
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          style={style}
        >
          {children}
        </svg>
      );

      const Maximize2 = (p) => <IconBase {...p}><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></IconBase>;
      const Minimize2 = (p) => <IconBase {...p}><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></IconBase>;
      const Sun = (p) => <IconBase {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconBase>;
      const Moon = (p) => <IconBase {...p}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconBase>;
      const Calendar = (p) => <IconBase {...p}><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></IconBase>;
      const Clock = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>;
      const Trash2 = (p) => <IconBase {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;
      const Layers = (p) => <IconBase {...p}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 12.5-8.58 3.91a2 2 0 0 1-1.66 0L2 12.5"/><path d="m22 17.5-8.58 3.91a2 2 0 0 1-1.66 0L2 17.5"/></IconBase>;
      const Check = (p) => <IconBase {...p} strokeWidth={p.strokeWidth || 2.5}><polyline points="20 6 9 17 4 12"/></IconBase>;
      const CheckCircle2 = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconBase>;
      const ChevronLeft = (p) => <IconBase {...p}><path d="m15 18-6-6 6-6"/></IconBase>;
      const ChevronRight = (p) => <IconBase {...p}><path d="m9 18 6-6-6-6"/></IconBase>;
      const Plus = (p) => <IconBase {...p}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>;
      const X = (p) => <IconBase {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
      const RotateCcw = (p) => <IconBase {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconBase>;

      // --- DATE UTILS ---
      const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const MONTHS = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ];
      const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      const pad = (n) => String(n).padStart(2, "0");

      const toISO = (d) => {
        const safeD = d instanceof Date && !isNaN(d.getTime()) ? d : new Date();
        return `${safeD.getFullYear()}-${pad(safeD.getMonth() + 1)}-${pad(safeD.getDate())}`;
      };

      const fromISO = (s) => {
        if (!s || typeof s !== 'string') return new Date();
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, (m || 1) - 1, d || 1);
      };

      const addDays = (d, n) => {
        const safeD = d instanceof Date && !isNaN(d.getTime()) ? d : new Date();
        const r = new Date(safeD);
        r.setDate(r.getDate() + n);
        return r;
      };

      const addMonths = (d, n) => {
        const safeD = d instanceof Date && !isNaN(d.getTime()) ? d : new Date();
        const r = new Date(safeD);
        r.setMonth(r.getMonth() + n);
        return r;
      };

      const addYears = (d, n) => {
        const safeD = d instanceof Date && !isNaN(d.getTime()) ? d : new Date();
        const r = new Date(safeD);
        r.setFullYear(r.getFullYear() + n);
        return r;
      };

      const startOfWeek = (d) => {
        const safeD = d instanceof Date && !isNaN(d.getTime()) ? d : new Date();
        const day = safeD.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        return addDays(safeD, diff);
      };

      const isSameDay = (a, b) => {
        if (!a || !b) return false;
        return toISO(a) === toISO(b);
      };

      const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;

      const formatTaskTimestamp = (task) => {
        if (task.date) {
          const parts = task.date.split('-').map(Number);
          if (parts.length === 3) {
            const [y, m, day] = parts;
            let timeStr = task.time;
            if (!timeStr && task.createdAt) {
              const d = new Date(task.createdAt);
              if (!isNaN(d.getTime())) {
                timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
              }
            }
            return `${y}.${m}.${day} ${timeStr || '09:00'}`;
          }
        }
        if (task.createdAt) {
          const d = new Date(task.createdAt);
          if (!isNaN(d.getTime())) {
            return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
          }
        }
        const now = new Date();
        return `${now.getFullYear()}.${now.getMonth() + 1}.${now.getDate()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
      };

      // --- SOUND MANAGER ---
      class SoundManager {
        constructor() {
          this.ctx = null;
          this.audioPool = [];
          this.poolIndex = 0;

          if (typeof window !== 'undefined') {
            try {
              const soundUrls = ['./sounds/check-ding.wav', './public/sounds/check-ding.wav'];
              for (let i = 0; i < 3; i++) {
                const a = new Audio(soundUrls[0]);
                a.volume = 0.65;
                this.audioPool.push(a);
              }
            } catch (e) {}

            const unlock = () => {
              const ctx = this.getContext();
              if (ctx && ctx.state === 'suspended') {
                ctx.resume();
              }
            };
            window.addEventListener('pointerdown', unlock, { once: true });
            window.addEventListener('keydown', unlock, { once: true });
          }
        }

        getContext() {
          if (!this.ctx && typeof window !== 'undefined') {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        }

        playCompleteSound() {
          try {
            if (this.audioPool.length > 0) {
              const a = this.audioPool[this.poolIndex];
              this.poolIndex = (this.poolIndex + 1) % this.audioPool.length;
              a.currentTime = 0;
              const p = a.play();
              if (p && p.catch) p.catch(() => this.synthesizeChime());
            } else {
              this.synthesizeChime();
            }
          } catch {
            this.synthesizeChime();
          }
        }

        synthesizeChime() {
          const ctx = this.getContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          
          const freqs = [1567.98, 2349.32];
          freqs.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            const initialGain = idx === 0 ? 0.35 : 0.18;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(initialGain, now + 0.003);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
          });
        }

        playUncheckSound() {
          const ctx = this.getContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1174.66, now);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.06, now + 0.001);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      }

      const soundManager = new SoundManager();

      // --- THEME CONTEXT ---
      const ThemeContext = createContext();

      const ThemeProvider = ({ children }) => {
        const [themeMode, setThemeModeState] = useState(() => {
          if (typeof window !== 'undefined') {
            const saved = localStorage.getItem('humutopia_theme_mode');
            if (saved === 'light' || saved === 'dark') return saved;
          }
          return 'dark';
        });

        useEffect(() => {
          if (typeof window !== 'undefined') {
            localStorage.setItem('humutopia_theme_mode', themeMode);
          }
        }, [themeMode]);

        const toggleTheme = () => setThemeModeState((p) => (p === 'light' ? 'dark' : 'light'));
        const isDay = themeMode === 'light';
        const accentColor = '#e5a45b';

        return (
          <ThemeContext.Provider value={{ themeMode, isDay, toggleTheme, accentColor }}>
            {children}
          </ThemeContext.Provider>
        );
      };

      const useTheme = () => useContext(ThemeContext);

      // --- TASKS HOOK ---
      const STORAGE_KEY = 'dwmy-tasks-spatial-v4';

      function useTasks() {
        const [tasks, setTasks] = useState([]);
        const [loaded, setLoaded] = useState(false);

        useEffect(() => {
          try {
            if (typeof window !== 'undefined' && window.localStorage) {
              const local = window.localStorage.getItem(STORAGE_KEY);
              if (local) {
                const parsed = JSON.parse(local);
                if (Array.isArray(parsed)) {
                  setTasks(parsed);
                }
              }
            }
          } catch (e) {
            console.warn('Could not read tasks from storage:', e);
          } finally {
            setLoaded(true);
          }
        }, []);

        useEffect(() => {
          if (!loaded) return;
          try {
            if (typeof window !== 'undefined' && window.localStorage) {
              window.localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            }
          } catch (e) {
            console.error('Could not save tasks:', e);
          }
        }, [tasks, loaded]);

        return { tasks, setTasks, loaded };
      }

      // --- CHECKBOX COMPONENT ---
      const Checkbox = ({ done, onClick, accentColor, variant = 'filled' }) => {
        const { isDay, accentColor: contextAccent } = useTheme();
        const activeColor = accentColor || contextAccent;
        const isOutline = variant === 'outline';

        return (
          <button
            type="button"
            onClick={(e) => {
              e.stopPropagation();
              onClick(e);
            }}
            className={`relative flex items-center justify-center w-5 h-5 sm:w-[17px] sm:h-[17px] rounded-[4px] border transition-all duration-200 cursor-pointer flex-shrink-0 group ${
              done
                ? isOutline
                  ? isDay
                    ? 'bg-transparent shadow-[0_1px_3px_rgba(0,0,0,0.02)]'
                    : 'bg-transparent shadow-[0_0_8px_rgba(229,164,91,0.2)]'
                  : isDay
                  ? 'shadow-[0_1px_3px_rgba(0,0,0,0.06)]'
                  : 'shadow-[0_1px_4px_rgba(0,0,0,0.4)]'
                : isDay
                ? 'bg-black/[0.04] border-black/20 hover:border-black/40 hover:bg-black/[0.08]'
                : 'bg-white/5 border-white/20 hover:border-white/40 hover:bg-white/10 hover:shadow-[0_0_8px_rgba(255,255,255,0.1)]'
            }`}
            style={
              done
                ? isOutline
                  ? { borderColor: activeColor }
                  : { backgroundColor: activeColor, borderColor: activeColor }
                : undefined
            }
            aria-label={done ? 'Mark not done' : 'Mark done'}
          >
            {done && (
              <Check
                size={12}
                strokeWidth={2.5}
                style={isOutline ? { color: activeColor } : undefined}
                className={`${
                  isOutline ? '' : isDay ? 'text-white' : 'text-zinc-950'
                } transition-transform scale-100`}
              />
            )}
          </button>
        );
      };

      // --- TASK ROW ---
      const TaskRow = ({ task, onToggle, accentColor, checkboxVariant = 'filled' }) => {
        const { isDay, accentColor: contextAccent } = useTheme();
        const activeColor = accentColor || contextAccent;

        return (
          <div
            onClick={() => onToggle(task.id)}
            className={`group relative flex items-center gap-2 py-1.5 px-2 rounded-md transition-all duration-150 border border-transparent cursor-pointer min-w-0 ${
              isDay
                ? 'hover:bg-black/[0.04] active:bg-black/[0.06]'
                : 'hover:bg-white/[0.06] active:bg-white/[0.08]'
            }`}
          >
            <Checkbox
              done={task.done}
              onClick={() => onToggle(task.id)}
              accentColor={activeColor}
              variant={checkboxVariant}
            />

            <span
              title={task.title}
              className={`text-xs sm:text-xs leading-normal flex-1 min-w-0 truncate select-none transition-colors ${
                task.done
                  ? isDay
                    ? 'text-zinc-400 line-through decoration-zinc-400/80 font-normal'
                    : 'text-zinc-500 line-through decoration-zinc-500/80 font-normal'
                  : isDay
                  ? 'text-zinc-700 font-normal group-hover:text-zinc-950'
                  : 'text-zinc-200 font-normal group-hover:text-white'
              }`}
            >
              {task.title}
            </span>
          </div>
        );
      };

      // --- QUICK ADD COMPONENT ---
      const QuickAdd = ({
        placeholder = 'Add a task…',
        onSubmit,
        autoFocus = false,
        className = '',
        allowDateSelection = false,
        initialDate,
        initialTime,
      }) => {
        const { isDay, accentColor } = useTheme();
        const [value, setValue] = useState('');
        const [isActive, setIsActive] = useState(false);

        const now = new Date();
        const todayISO = toISO(now);
        const defaultCurrentTime = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

        const [selectedDate, setSelectedDate] = useState(initialDate || todayISO);
        const [selectedTime, setSelectedTime] = useState(initialTime || defaultCurrentTime);
        const [isAllDay, setIsAllDay] = useState(false);

        const [showDatePicker, setShowDatePicker] = useState(false);
        const [showTimePicker, setShowTimePicker] = useState(false);

        const [calendarMonth, setCalendarMonth] = useState(() => fromISO(selectedDate || todayISO));

        const containerRef = useRef(null);
        const inputRef = useRef(null);
        const dateDropdownRef = useRef(null);
        const timeDropdownRef = useRef(null);

        useEffect(() => {
          if (autoFocus && inputRef.current) inputRef.current.focus();
        }, [autoFocus]);

        useEffect(() => {
          if (initialDate) {
            setSelectedDate(initialDate);
            setCalendarMonth(fromISO(initialDate));
          }
        }, [initialDate]);

        useEffect(() => {
          const handleDocClick = (e) => {
            const target = e.target;
            if (dateDropdownRef.current && !dateDropdownRef.current.contains(target) && !containerRef.current?.contains(target)) {
              setShowDatePicker(false);
            }
            if (timeDropdownRef.current && !timeDropdownRef.current.contains(target) && !containerRef.current?.contains(target)) {
              setShowTimePicker(false);
            }
            if (containerRef.current && !containerRef.current.contains(target)) {
              if (!value.trim()) {
                setIsActive(false);
                setShowDatePicker(false);
                setShowTimePicker(false);
              }
            }
          };
          document.addEventListener('pointerdown', handleDocClick);
          return () => document.removeEventListener('pointerdown', handleDocClick);
        }, [value]);

        const handleInputChange = (e) => {
          const text = e.target.value;
          setValue(text);
          const timeMatch = text.match(/\b([01]?[0-9]|2[0-3]):([0-5][0-9])\b/);
          if (timeMatch) {
            setSelectedTime(timeMatch[0]);
            setIsAllDay(false);
          }
        };

        const handleSubmit = () => {
          const trimmed = value.trim();
          if (!trimmed) {
            setIsActive(false);
            setShowDatePicker(false);
            setShowTimePicker(false);
            return;
          }
          const timeToSubmit = isAllDay ? null : selectedTime || null;
          onSubmit(trimmed, selectedDate, timeToSubmit);
          setValue('');
          setIsActive(false);
          setShowDatePicker(false);
          setShowTimePicker(false);
          if (initialDate) {
            setSelectedDate(initialDate);
            setCalendarMonth(fromISO(initialDate));
          }
          const freshNow = new Date();
          setSelectedTime(`${pad(freshNow.getHours())}:${pad(freshNow.getMinutes())}`);
          setIsAllDay(false);
        };

        const formatDisplayDate = (isoStr) => {
          if (!isoStr) return '';
          const parts = isoStr.split('-').map(Number);
          if (parts.length !== 3) return isoStr;
          const [y, m, d] = parts;
          if (isoStr === todayISO) return `今天 ${pad(m)}.${pad(d)}`;
          const tomorrowISO = toISO(addDays(now, 1));
          if (isoStr === tomorrowISO) return `明天 ${pad(m)}.${pad(d)}`;
          return `${y}.${pad(m)}.${pad(d)}`;
        };

        const showDateTimeOnLeft = allowDateSelection && (isActive || value.trim().length > 0);

        const calYear = calendarMonth.getFullYear();
        const calMonth = calendarMonth.getMonth();
        const firstOfMonth = new Date(calYear, calMonth, 1);
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const startDay = startOfWeek(firstOfMonth);
        const endOfMonth = new Date(calYear, calMonth, daysInMonth);
        const diffDays = Math.round((endOfMonth.getTime() - startDay.getTime()) / (1000 * 60 * 60 * 24)) + 1;
        const cellCount = diffDays > 35 ? 42 : 35;
        const calendarCells = Array.from({ length: cellCount }, (_, i) => addDays(startDay, i));

        const [hourPart, minutePart] = (selectedTime || '09:00').split(':').map((v) => parseInt(v, 10) || 0);

        return (
          <div
            ref={containerRef}
            className={`relative flex flex-col transition-all duration-200 rounded-xl border ${
              isDay
                ? isActive
                  ? 'bg-white/90 border-[#c97a2b]/40 shadow-[0_4px_20px_rgba(0,0,0,0.06)]'
                  : 'bg-black/[0.03] border-black/10 hover:border-black/20'
                : isActive
                ? 'bg-white/[0.06] border-[#e5a45b]/40 shadow-[0_4px_25px_rgba(0,0,0,0.5)]'
                : 'bg-white/[0.03] border-white/10 hover:border-white/20'
            } ${className}`}
          >
            <div className="flex flex-wrap sm:flex-nowrap items-center w-full px-3 py-2 gap-2 relative">
              <div className="text-zinc-400 flex items-center justify-center flex-shrink-0">
                <Plus
                  size={14}
                  style={isActive ? { color: accentColor } : undefined}
                  className={!isActive ? (isDay ? 'text-zinc-500' : 'text-zinc-400') : ''}
                />
              </div>

              {showDateTimeOnLeft && (
                <div className="flex items-center gap-1.5 flex-shrink-0 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                  <div className="relative">
                    <button
                      type="button"
                      onMouseDown={(e) => {
                        e.preventDefault();
                        if (!showDatePicker) setCalendarMonth(fromISO(selectedDate || todayISO));
                        setShowDatePicker((p) => !p);
                        setShowTimePicker(false);
                      }}
                      className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-mono border transition-all cursor-pointer select-none ${
                        showDatePicker
                          ? isDay
                            ? 'bg-[#c97a2b]/15 border-[#c97a2b]/40 text-[#c97a2b]'
                            : 'bg-[#e5a45b]/15 border-[#e5a45b]/40 text-[#e5a45b]'
                          : isDay
                          ? 'bg-black/[0.04] hover:bg-black/[0.08] border-black/[0.08] text-zinc-700'
                          : 'bg-white/[0.03] hover:bg-white/[0.08] border-white/[0.08] text-zinc-300'
                      }`}
                    >
                      <Calendar size={11} style={{ color: accentColor }} />
                      <span className="tracking-wide">{formatDisplayDate(selectedDate)}</span>
                    </button>

                    {showDatePicker && (
                      <div
                        ref={dateDropdownRef}
                        className={`fixed sm:absolute left-1/2 sm:left-0 -translate-x-1/2 sm:translate-x-0 bottom-12 sm:bottom-full sm:mb-2.5 z-50 w-[90vw] sm:w-64 p-3 rounded-xl border transition-all shadow-2xl ${
                          isDay
                            ? 'bg-[#f7f9fb] border-black/[0.08] text-zinc-800'
                            : 'bg-[#1e2228] border-white/[0.12] text-zinc-200'
                        }`}
                      >
                        <div className={`flex items-center justify-between pb-2 mb-2 border-b ${isDay ? 'border-black/[0.06]' : 'border-white/[0.08]'}`}>
                          <button
                            type="button"
                            onMouseDown={(e) => {
                              e.preventDefault();
                              setCalendarMonth((p) => addMonths(p, -1));
                            }}
                            className={`p-1 rounded-md transition-colors cursor-pointer ${isDay ? 'hover:bg-black/5 text-zinc-500' : 'hover:bg-white/10 text-zinc-400'}`}
                          >
                            <ChevronLeft size={14} />
                          </button>
                          <span className="font-mono text-[12px] font-medium tracking-wide">
                            {calYear}年 {calMonth + 1}月
                          </span>
                          <button
                            type="button"
                            onMouseDown={(e) => {
                              e.preventDefault();
                              setCalendarMonth((p) => addMonths(p, 1));
                            }}
                            className={`p-1 rounded-md transition-colors cursor-pointer ${isDay ? 'hover:bg-black/5 text-zinc-500' : 'hover:bg-white/10 text-zinc-400'}`}
                          >
                            <ChevronRight size={14} />
                          </button>
                        </div>

                        <div className="grid grid-cols-7 gap-1 text-center mb-1">
                          {['一', '二', '三', '四', '五', '六', '日'].map((w) => (
                            <span key={w} className={`text-[10px] font-mono font-medium py-0.5 ${isDay ? 'text-zinc-500' : 'text-zinc-400/80'}`}>
                              {w}
                            </span>
                          ))}
                        </div>

                        <div className="grid grid-cols-7 gap-1">
                          {calendarCells.map((d) => {
                            const iso = toISO(d);
                            const isCurrentM = d.getMonth() === calMonth;
                            const isSelected = iso === selectedDate;
                            const isTodayDay = isSameDay(d, now);

                            return (
                              <button
                                key={iso}
                                type="button"
                                onMouseDown={(e) => {
                                  e.preventDefault();
                                  setSelectedDate(iso);
                                  setShowDatePicker(false);
                                  inputRef.current?.focus();
                                }}
                                className={`aspect-square rounded-lg flex items-center justify-center font-mono text-[11px] transition-all cursor-pointer relative ${
                                  isSelected
                                    ? isDay
                                      ? 'bg-[#c97a2b] text-white font-semibold'
                                      : 'bg-[#e5a45b] text-zinc-950 font-semibold'
                                    : isTodayDay
                                    ? isDay
                                      ? 'border border-[#c97a2b]/60 text-[#c97a2b] font-medium'
                                      : 'border border-[#e5a45b]/60 text-[#e5a45b] font-medium'
                                    : isCurrentM
                                    ? isDay
                                      ? 'text-zinc-700 hover:bg-black/5'
                                      : 'text-zinc-200 hover:bg-white/10'
                                    : isDay
                                    ? 'text-zinc-300'
                                    : 'text-zinc-600/70'
                                }`}
                              >
                                {d.getDate()}
                              </button>
                            );
                          })}
                        </div>

                        <div className={`mt-2.5 pt-2 border-t flex items-center justify-between text-[11px] font-mono ${isDay ? 'border-black/[0.06]' : 'border-white/[0.08]'}`}>
                          <button
                            type="button"
                            onMouseDown={(e) => {
                              e.preventDefault();
                              setSelectedDate(todayISO);
                              setCalendarMonth(new Date());
                              setShowDatePicker(false);
                              inputRef.current?.focus();
                            }}
                            className="text-[#c97a2b] dark:text-[#e5a45b] hover:underline cursor-pointer"
                          >
                            设为今天
                          </button>
                          <span className="text-zinc-400 text-[10px]">已选: {selectedDate}</span>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="relative">
                    <button
                      type="button"
                      onMouseDown={(e) => {
                        e.preventDefault();
                        setShowTimePicker((p) => !p);
                        setShowDatePicker(false);
                      }}
                      className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-mono border transition-all cursor-pointer select-none ${
                        showTimePicker
                          ? isDay
                            ? 'bg-[#c97a2b]/15 border-[#c97a2b]/40 text-[#c97a2b]'
                            : 'bg-[#e5a45b]/15 border-[#e5a45b]/40 text-[#e5a45b]'
                          : isDay
                          ? 'bg-black/[0.04] hover:bg-black/[0.08] border-black/[0.08] text-zinc-700'
                          : 'bg-white/[0.03] hover:bg-white/[0.08] border-white/[0.08] text-zinc-300'
                      }`}
                    >
                      <Clock size={11} style={{ color: accentColor }} />
                      <span className="tracking-wide">{isAllDay ? '全天' : selectedTime || '设置时间'}</span>
                    </button>

                    {showTimePicker && (
                      <div
                        ref={timeDropdownRef}
                        className={`fixed sm:absolute left-1/2 sm:left-0 -translate-x-1/2 sm:translate-x-0 bottom-12 sm:bottom-full sm:mb-2.5 z-50 w-[85vw] sm:w-56 p-3 rounded-xl border transition-all shadow-2xl ${
                          isDay
                            ? 'bg-[#f7f9fb] border-black/[0.08] text-zinc-800'
                            : 'bg-[#1e2228] border-white/[0.12] text-zinc-200'
                        }`}
                      >
                        <div className={`flex items-center justify-between pb-2 mb-2 border-b ${isDay ? 'border-black/[0.06]' : 'border-white/[0.08]'}`}>
                          <span className="font-mono text-[11px] font-medium text-zinc-500 uppercase tracking-wider">
                            自定义时间
                          </span>
                          <button
                            type="button"
                            onMouseDown={(e) => {
                              e.preventDefault();
                              setIsAllDay(!isAllDay);
                            }}
                            className={`px-2 py-0.5 rounded-md text-[10.5px] font-mono transition-all cursor-pointer border ${
                              isAllDay
                                ? isDay
                                  ? 'bg-[#c97a2b]/20 border-[#c97a2b]/40 text-[#c97a2b] font-medium'
                                  : 'bg-[#e5a45b]/20 border-[#e5a45b]/40 text-[#e5a45b] font-medium'
                                : isDay
                                ? 'border-black/10 text-zinc-600 hover:bg-black/5'
                                : 'border-white/10 text-zinc-400 hover:bg-white/10'
                            }`}
                          >
                            全天
                          </button>
                        </div>

                        {!isAllDay ? (
                          <div className="space-y-3">
                            <div className="flex items-center justify-center gap-2 py-1">
                              <div className="flex flex-col items-center">
                                <span className="text-[9px] font-mono text-zinc-400 mb-1">时</span>
                                <select
                                  value={pad(hourPart)}
                                  onChange={(e) => setSelectedTime(`${e.target.value}:${pad(minutePart)}`)}
                                  className={`font-mono text-[14px] font-medium px-2 py-1 rounded-lg border focus:outline-none cursor-pointer ${
                                    isDay ? 'bg-black/[0.03] border-black/10 text-zinc-800' : 'bg-white/[0.05] border-white/15 text-zinc-100'
                                  }`}
                                >
                                  {Array.from({ length: 24 }, (_, i) => pad(i)).map((h) => (
                                    <option key={h} value={h} className={isDay ? 'bg-[#f7f9fb] text-zinc-800' : 'bg-[#1e2228] text-zinc-100'}>
                                      {h}
                                    </option>
                                  ))}
                                </select>
                              </div>

                              <span className="font-mono text-[16px] font-bold text-zinc-400 pt-3">:</span>

                              <div className="flex flex-col items-center">
                                <span className="text-[9px] font-mono text-zinc-400 mb-1">分</span>
                                <select
                                  value={pad(minutePart)}
                                  onChange={(e) => setSelectedTime(`${pad(hourPart)}:${e.target.value}`)}
                                  className={`font-mono text-[14px] font-medium px-2 py-1 rounded-lg border focus:outline-none cursor-pointer ${
                                    isDay ? 'bg-black/[0.03] border-black/10 text-zinc-800' : 'bg-white/[0.05] border-white/15 text-zinc-100'
                                  }`}
                                >
                                  {Array.from({ length: 60 }, (_, i) => pad(i)).map((m) => (
                                    <option key={m} value={m} className={isDay ? 'bg-[#f7f9fb] text-zinc-800' : 'bg-[#1e2228] text-zinc-100'}>
                                      {m}
                                    </option>
                                  ))}
                                </select>
                              </div>
                            </div>

                            <div className="grid grid-cols-4 gap-1 pt-1">
                              {['09:00', '12:00', '15:00', '19:00'].map((preset) => (
                                <button
                                  key={preset}
                                  type="button"
                                  onMouseDown={(e) => {
                                    e.preventDefault();
                                    setSelectedTime(preset);
                                    setIsAllDay(false);
                                  }}
                                  className={`py-1 text-center font-mono text-[10.5px] rounded-md transition-colors cursor-pointer border ${
                                    selectedTime === preset
                                      ? isDay
                                        ? 'bg-[#c97a2b]/15 text-[#c97a2b] border-[#c97a2b]/30 font-medium'
                                        : 'bg-[#e5a45b]/15 text-[#e5a45b] border-[#e5a45b]/30 font-medium'
                                      : isDay
                                      ? 'border-black/5 text-zinc-600 hover:bg-black/5'
                                      : 'border-white/5 text-zinc-400 hover:bg-white/10'
                                  }`}
                                >
                                  {preset}
                                </button>
                              ))}
                            </div>
                          </div>
                        ) : (
                          <div className="py-4 text-center text-[12px] font-mono text-zinc-400 italic">
                            已设置为全天任务
                          </div>
                        )}

                        <div className={`mt-3 pt-2 border-t flex justify-end ${isDay ? 'border-black/[0.08]' : 'border-white/[0.08]'}`}>
                          <button
                            type="button"
                            onMouseDown={(e) => {
                              e.preventDefault();
                              setShowTimePicker(false);
                              inputRef.current?.focus();
                            }}
                            className={`inline-flex items-center gap-1 px-3 py-1 rounded-lg text-[11px] font-mono font-medium transition-all cursor-pointer ${
                              isDay ? 'bg-[#c97a2b] text-white hover:bg-[#b36922]' : 'bg-[#e5a45b] text-zinc-950 hover:bg-[#f0b574]'
                            }`}
                          >
                            <Check size={11} />
                            <span>确定</span>
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className={`hidden sm:block h-4 w-px mx-0.5 ${isDay ? 'bg-black/10' : 'bg-white/10'}`} />
                </div>
              )}

              <input
                ref={inputRef}
                type="text"
                className={`flex-1 bg-transparent border-none text-[13px] py-1 px-1 focus:outline-none min-w-[120px] ${
                  isDay ? 'text-zinc-800 placeholder:text-zinc-400' : 'text-zinc-100 placeholder:text-zinc-400'
                }`}
                placeholder={placeholder}
                value={value}
                onChange={handleInputChange}
                onFocus={() => setIsActive(true)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSubmit();
                  }
                  if (e.key === 'Escape') {
                    setValue('');
                    setIsActive(false);
                    setShowDatePicker(false);
                    setShowTimePicker(false);
                    inputRef.current?.blur();
                  }
                }}
              />

              {value.trim().length > 0 && (
                <div className="flex items-center gap-1.5 flex-shrink-0">
                  <button
                    type="button"
                    onMouseDown={(e) => {
                      e.preventDefault();
                      setValue('');
                    }}
                    className="p-1 rounded text-zinc-400 hover:text-zinc-600 transition-colors cursor-pointer"
                    aria-label="清除"
                  >
                    <X size={12} />
                  </button>

                  <button
                    type="button"
                    onMouseDown={(e) => {
                      e.preventDefault();
                      handleSubmit();
                    }}
                    className="text-[11px] font-mono font-medium px-2.5 py-1 rounded-lg bg-[#e5a45b]/20 text-[#e5a45b] border border-[#e5a45b]/40 hover:bg-[#e5a45b]/30 transition-colors cursor-pointer"
                  >
                    添加 ↵
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      };

      // --- DAY VIEW ---
      const DayView = ({
        date,
        anchor,
        tasks = [],
        allTasks,
        tasksOn,
        addTask,
        onAddTask,
        toggleTask,
        onToggleTask,
        deleteTask,
        onDeleteTask,
        accentColor: propAccentColor,
      }) => {
        const { isDay, accentColor: themeAccentColor } = useTheme();
        const accentColor = propAccentColor || themeAccentColor;
        const currentDate = date || anchor || new Date();
        const handleAddTask = onAddTask || addTask || (() => {});
        const handleToggleTask = onToggleTask || toggleTask || (() => {});
        const handleDeleteTask = onDeleteTask || deleteTask || (() => {});

        const iso = toISO(currentDate);
        const todayISO = toISO(new Date());
        const currentDateStr = `${currentDate.getFullYear()}.${pad(currentDate.getMonth() + 1)}.${pad(currentDate.getDate())}`;

        const sourceTasks = allTasks || tasks || tasksOn(iso);

        const getTaskTimestamp = (t) => {
          if (t.date) {
            const [y, m, d] = t.date.split('-').map(Number);
            if (y && m && d) {
              const dateObj = new Date(y, m - 1, d);
              if (t.time) {
                const [h, min] = t.time.split(':').map(Number);
                dateObj.setHours(h || 0, min || 0, 0, 0);
              } else {
                dateObj.setHours(9, 0, 0, 0);
              }
              return dateObj.getTime();
            }
          }
          if (t.createdAt) {
            const parsed = new Date(t.createdAt).getTime();
            if (!isNaN(parsed)) return parsed;
          }
          return 0;
        };

        const getTaskPeriod = (t) => {
          const taskDate = t.date || (t.createdAt ? toISO(new Date(t.createdAt)) : todayISO);
          if (taskDate < todayISO) return 'past';
          if (taskDate > todayISO) return 'future';
          return 'today';
        };

        const timelineTasks = [...sourceTasks].sort((a, b) => getTaskTimestamp(b) - getTaskTimestamp(a));
        const completedCount = timelineTasks.filter((t) => t.done).length;

        return (
          <div className="space-y-4">
            <div className="flex items-center justify-between -mt-2">
              <div
                className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-mono border ${
                  isDay
                    ? 'bg-black/[0.04] border-black/[0.08] text-zinc-700'
                    : 'bg-white/[0.03] border-white/[0.08] text-zinc-300'
                }`}
              >
                <Layers size={11} style={{ color: accentColor }} />
                <span className="tracking-wide">Floating Glass</span>
              </div>

              <div
                className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-mono border ${
                  isDay
                    ? 'bg-black/[0.04] border-black/[0.08] text-zinc-700'
                    : 'bg-white/[0.03] border-white/[0.08] text-zinc-300'
                }`}
              >
                <Calendar size={11} style={{ color: accentColor }} />
                <span className="tracking-wide">{currentDateStr}</span>
              </div>
            </div>

            <div
              className={`rounded-xl p-3 sm:p-6 border relative ${
                isDay
                  ? 'bg-white/65 border-black/[0.06] shadow-sm'
                  : 'bg-white/[0.03] border-white/[0.08]'
              }`}
            >
              <div className={`flex items-center justify-between mb-3 pb-2 border-b ${isDay ? 'border-black/[0.07]' : 'border-white/[0.08]'}`}>
                <div className="flex items-center gap-2">
                  <span
                    className="w-1.5 h-1.5 rounded-full shadow-[0_0_8px_currentColor]"
                    style={{ backgroundColor: accentColor, color: accentColor }}
                  />
                  <span className={`font-mono text-[11px] tracking-wider uppercase font-medium ${isDay ? 'text-zinc-700' : 'text-zinc-300'}`}>
                    Tasks Timeline
                  </span>
                </div>

                <span className={`font-mono text-[11px] ${isDay ? 'text-zinc-500' : 'text-zinc-400'}`}>
                  {completedCount}/{timelineTasks.length}
                </span>
              </div>

              <div className="relative mb-4">
                <div
                  className="relative max-h-[360px] sm:max-h-[420px] overflow-y-auto overscroll-contain pr-1 hide-native-scrollbar focus:outline-none"
                  style={{ WebkitOverflowScrolling: 'touch' }}
                >
                  {timelineTasks.length > 0 ? (
                    <div className="relative space-y-1.5 min-h-[120px] pb-1">
                      <div className={`absolute left-[7px] top-3 bottom-3 w-[1px] pointer-events-none ${isDay ? 'bg-black/[0.10]' : 'bg-white/[0.08]'}`} />

                      {timelineTasks.map((t) => {
                        const timeLabel = formatTaskTimestamp(t);
                        const period = getTaskPeriod(t);

                        return (
                          <div
                            key={t.id}
                            className={`group relative flex items-center justify-between gap-2 sm:gap-4 py-2 px-2.5 sm:px-3 rounded-lg border transition-all duration-150 ${
                              t.done
                                ? isDay
                                  ? 'bg-black/[0.015] border-black/[0.04] opacity-75'
                                  : 'bg-white/[0.015] border-white/[0.05] opacity-75'
                                : isDay
                                ? 'bg-white/80 hover:bg-white border-black/[0.06] shadow-sm'
                                : 'bg-white/[0.03] hover:bg-white/[0.06] border-white/[0.08]'
                            }`}
                          >
                            <div className="flex items-center gap-2 sm:gap-2.5 flex-shrink-0">
                              <span
                                className={`w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full border transition-all z-10 ${
                                  t.done
                                    ? isDay
                                      ? 'bg-zinc-400 border-zinc-400'
                                      : 'bg-zinc-600 border-zinc-500'
                                    : period === 'today'
                                    ? 'border-[#e5a45b] bg-[#e5a45b]'
                                    : period === 'future'
                                    ? 'border-sky-500 bg-sky-500'
                                    : 'border-zinc-400 bg-zinc-400'
                                }`}
                                style={!t.done && period === 'today' ? { borderColor: accentColor } : undefined}
                              />
                              <span className={`font-mono text-[10.5px] sm:text-[12px] transition-colors tracking-tight select-none ${isDay ? 'text-zinc-600' : 'text-zinc-300'}`}>
                                {timeLabel}
                              </span>
                            </div>

                            <div
                              onClick={() => handleToggleTask(t.id)}
                              className="flex-1 min-w-0 px-1 cursor-pointer select-none"
                            >
                              <span
                                className={`text-[13px] sm:text-[14px] leading-snug break-words transition-colors block ${
                                  t.done
                                    ? isDay
                                      ? 'text-zinc-400 line-through font-normal'
                                      : 'text-zinc-500 line-through font-normal'
                                    : isDay
                                    ? 'text-zinc-800 font-normal'
                                    : 'text-zinc-100 font-normal'
                                }`}
                              >
                                {t.title}
                              </span>
                            </div>

                            <div className="flex items-center gap-1.5 sm:gap-2.5 flex-shrink-0">
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  handleDeleteTask(t.id);
                                }}
                                className={`opacity-80 sm:opacity-0 group-hover:opacity-100 p-1.5 sm:p-1 rounded transition-all duration-150 cursor-pointer ${
                                  isDay
                                    ? 'text-zinc-400 hover:text-rose-600 hover:bg-rose-500/10'
                                    : 'text-zinc-500 hover:text-rose-300 hover:bg-rose-500/10'
                                }`}
                                aria-label="Delete task"
                                title="Delete task"
                              >
                                <Trash2 size={13} />
                              </button>

                              <Checkbox
                                done={t.done}
                                onClick={() => handleToggleTask(t.id)}
                                accentColor={accentColor}
                              />
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <div
                      className={`text-xs italic py-8 px-2 text-center border border-dashed rounded-lg ${
                        isDay ? 'text-zinc-500 border-black/10' : 'text-zinc-400 border-white/5'
                      }`}
                    >
                      暂无任务，可在下方快速添加
                    </div>
                  )}

              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
              {MONTHS.map((name, m) => {
                const first = new Date(year, m, 1);
                const firstWeekday = (first.getDay() + 6) % 7;
                const daysInMonth = new Date(year, m + 1, 0).getDate();
                const cells = [
                  ...Array(firstWeekday).fill(null),
                  ...Array.from({ length: daysInMonth }, (_, i) => i + 1),
                ];

                let monthTotalTasks = 0;
                for (let day = 1; day <= daysInMonth; day++) {
                  const d = new Date(year, m, day);
                  monthTotalTasks += tasksOn(toISO(d)).length;
                }

                const isCurrentMonth = currentToday.getFullYear() === year && currentToday.getMonth() === m;

                return (
                  <div
                    key={name}
                    className={`p-3 rounded-xl border transition-all duration-200 ${
                      isCurrentMonth
                        ? isDay
                          ? 'bg-[#e5a45b]/[0.10] border border-[#e5a45b]/45 shadow-sm'
                          : 'bg-[#e5a45b]/[0.05] border border-[#e5a45b]/35 shadow-sm'
                        : isDay
                        ? 'bg-white/55 border-black/[0.06] hover:bg-white/80'
                        : 'bg-white/[0.02] border-white/[0.06] hover:bg-white/[0.04]'
                    }`}
                  >
                    <div className={`flex items-center justify-between mb-2 pb-1.5 border-b ${isDay ? 'border-black/[0.05]' : 'border-white/[0.05]'}`}>
                      <button
                        type="button"
                        className="group flex items-baseline gap-1.5 text-left cursor-pointer"
                        onClick={() => {
                          handleSetAnchor(new Date(year, m, 1));
                          setView('month');
                        }}
                      >
                        <span className={`font-serif text-[14px] sm:text-[15px] font-medium transition-colors ${isDay ? 'text-zinc-800' : 'text-zinc-100'}`}>
                          {name}
                        </span>
                      </button>

                      {monthTotalTasks > 0 && (
                        <span
                          className="font-mono text-[9.5px] px-1.5 py-0.5 rounded border"
                          style={{
                            color: accentColor,
                            backgroundColor: isDay ? 'rgba(229, 164, 91, 0.12)' : 'rgba(229, 164, 91, 0.1)',
                            borderColor: isDay ? 'rgba(229, 164, 91, 0.3)' : 'rgba(229, 164, 91, 0.25)',
                          }}
                        >
                          {monthTotalTasks}
                        </span>
                      )}
                    </div>

                    <div className="grid grid-cols-7 gap-1">
                      {cells.map((day, idx) => {
                        if (day === null) {
                          return <div key={`empty-${idx}`} className="aspect-square" />;
                        }

                        const d = new Date(year, m, day);
                        const iso = toISO(d);
                        const tasksForDay = tasksOn(iso);
                        const count = tasksForDay.length;
                        const isToday = isSameDay(d, currentToday);
                        const cellBg = getDaySquareColor(iso, tasksForDay);

                        return (
                          <button
                            key={iso}
                            type="button"
                            onClick={() => jumpTo(d, 'day')}
                            title={`${iso}${count > 0 ? ` (${count} tasks)` : ''}`}
                            className={`aspect-square rounded-[3px] transition-all cursor-pointer relative group ${cellBg} ${
                              isToday ? (isDay ? 'ring-1 ring-black/60' : 'ring-1 ring-white/70') : ''
                            }`}
                          >
                            {isToday && (
                              <span className={`absolute inset-0 m-auto w-1 h-1 rounded-full ${isDay ? 'bg-black/75' : 'bg-white/90'}`} />
                            )}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      // --- AMBIENT LIGHTING COMPONENT ---
      const AmbientLighting = ({ environment, mousePos, intensity }) => {
        const lightX = 50 + mousePos.x * 35;
        const lightY = 40 + mousePos.y * 30;

        return (
          <>
            <div
              className="absolute -inset-10 rounded-[48px] pointer-events-none transition-all duration-500 ease-out z-[-1]"
              style={{
                background: `radial-gradient(ellipse 65% 55% at ${lightX}% ${lightY}%, ${environment.ambientColor} 0%, transparent 70%)`,
                filter: 'blur(54px)',
                opacity: 0.55 * intensity,
              }}
            />
            <div
              className="absolute -top-32 -right-24 w-96 h-96 rounded-full pointer-events-none transition-opacity duration-700 z-[-1]"
              style={{
                background: environment.ambientColor,
                filter: 'blur(80px)',
                opacity: 0.25 * intensity,
              }}
            />
          </>
        );
      };

      // --- SPATIAL BACKGROUND COMPONENT ---
      const SpatialBackground = ({ environment, blurAmount }) => {
        const canvasRef = useRef(null);
        const isMorning = environment.theme === 'light';

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          let animId;
          let width = (canvas.width = window.innerWidth);
          let height = (canvas.height = window.innerHeight);

          const handleResize = () => {
            if (!canvas) return;
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
          };
          window.addEventListener('resize', handleResize);

          const particleCount = 25;
          const particles = Array.from({ length: particleCount }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 2 + 0.6,
            vx: (Math.random() - 0.5) * 0.25,
            vy: -Math.random() * 0.35 - 0.1,
            alpha: Math.random() * 0.5 + 0.2,
            pulseSpeed: Math.random() * 0.02 + 0.01,
            pulsePhase: Math.random() * Math.PI * 2,
          }));

          let frame = 0;
          const render = () => {
            frame++;
            ctx.clearRect(0, 0, width, height);

            const isWarm = environment.theme === 'golden';
            const isDay = environment.theme === 'light';
            const baseR = isWarm ? 229 : isDay ? 255 : 160;
            const baseG = isWarm ? 164 : isDay ? 238 : 190;
            const baseB = isWarm ? 91 : isDay ? 210 : 255;

            particles.forEach((p) => {
              p.x += p.vx;
              p.y += p.vy;

              if (p.x < 0) p.x = width;
              if (p.x > width) p.x = 0;
              if (p.y < 0) p.y = height;
              if (p.y > height) p.y = 0;

              const currentAlpha = p.alpha * (0.6 + 0.4 * Math.sin(frame * p.pulseSpeed + p.pulsePhase));

              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${baseR}, ${baseG}, ${baseB}, ${currentAlpha})`;
              ctx.shadowBlur = 8;
              ctx.shadowColor = `rgba(${baseR}, ${baseG}, ${baseB}, ${currentAlpha * 0.8})`;
              ctx.fill();
            });

            animId = requestAnimationFrame(render);
          };

          render();

          return () => {
            cancelAnimationFrame(animId);
            window.removeEventListener('resize', handleResize);
          };
        }, [environment.theme]);

        return (
          <div className="fixed inset-0 pointer-events-none overflow-hidden z-0 select-none">
            <div className="absolute inset-0">
              <img
                src="./modern_spatial_room_1789282212504.jpg"
                onError={(e) => {
                  if (!e.target.dataset.triedSrc) {
                    e.target.dataset.triedSrc = '1';
                    e.target.src = './src/assets/images/modern_spatial_room_1789282212504.jpg';
                  }
                }}
                alt="Spatial Architectural Room"
                className="w-full h-full object-cover object-center transition-all duration-1000 ease-in-out scale-[1.02]"
                style={{
                  filter: isMorning
                    ? `blur(${blurAmount}px) brightness(1.06) contrast(1.02) saturate(1.0)`
                    : `blur(${blurAmount}px) brightness(0.88) contrast(1.02) saturate(1.12)`,
                }}
              />

              <div
                className={`absolute inset-0 transition-opacity duration-1000 pointer-events-none ${
                  isMorning ? 'opacity-100' : 'opacity-0'
                }`}
                style={{
                  background: `
                    radial-gradient(ellipse 110% 90% at 35% 15%, rgba(255, 255, 255, 0.25) 0%, rgba(225, 238, 250, 0.12) 45%, transparent 80%),
                    linear-gradient(to bottom, rgba(250, 252, 255, 0.15) 0%, rgba(240, 245, 252, 0.05) 50%, rgba(215, 230, 245, 0.12) 100%)
                  `,
                  mixBlendMode: 'screen',
                }}
              />

              <div
                className={`absolute inset-0 transition-opacity duration-1000 pointer-events-none ${
                  isMorning ? 'opacity-0' : 'opacity-100'
                }`}
                style={{
                  background: `radial-gradient(circle at 75% 25%, rgba(215, 185, 150, 0.12) 0%, rgba(15, 18, 22, 0.60) 75%)`,
                }}
              />

              <div
                className={`absolute inset-0 transition-all duration-1000 pointer-events-none ${
                  isMorning
                    ? 'bg-[radial-gradient(ellipse_at_center,transparent_60%,rgba(100,125,150,0.12)_100%)]'
                    : 'bg-[radial-gradient(ellipse_at_center,transparent_35%,rgba(5,7,9,0.72)_100%)]'
                }`}
              />
            </div>

            <canvas ref={canvasRef} className="absolute inset-0 w-full h-full opacity-65" />
          </div>
        );
      };

      // --- MAIN APPLICATION INNER ---
      function DwmyAppInner() {
        const { tasks, setTasks, loaded } = useTasks();
        const [view, setView] = useState('day');
        const [anchor, setAnchor] = useState(new Date());

        const { isDay, toggleTheme, accentColor } = useTheme();

        const currentEnv = isDay
          ? {
              id: 'morning-sunlight',
              name: '早晨 · Morning Pavilion',
              ambientColor: 'rgba(255, 255, 255, 0.40)',
              ambientAccent: '#c97a2b',
              theme: 'light',
            }
          : {
              id: 'golden-dusk',
              name: '傍晚 · Dusk Pavilion',
              ambientColor: 'rgba(235, 225, 210, 0.10)',
              ambientAccent: '#d89c56',
              theme: 'golden',
            };

        const blurAmount = 3;
        const lightIntensity = isDay ? 0.7 : 0.85;
        const [isMaximized, setIsMaximized] = useState(false);
        const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

        const addTask = useCallback((dateISO, title, time = null) => {
          const now = new Date();
          const defaultTime = time || `${pad(now.getHours())}:${pad(now.getMinutes())}`;
          setTasks((prev) => [
            ...prev,
            {
              id: uid(),
              date: dateISO,
              title,
              time: defaultTime,
              createdAt: now.toISOString(),
              done: false,
            },
          ]);
        }, [setTasks]);

        const toggleTask = useCallback((id) => {
          setTasks((prev) => {
            const target = prev.find((t) => t.id === id);
            if (target) {
              if (!target.done) {
                soundManager.playCompleteSound();
              } else {
                soundManager.playUncheckSound();
              }
            }
            return prev.map((t) => (t.id === id ? { ...t, done: !t.done } : t));
          });
        }, [setTasks]);

        const deleteTask = useCallback((id) => {
          setTasks((prev) => prev.filter((t) => t.id !== id));
        }, [setTasks]);

        const tasksOn = useCallback((iso) => {
          return tasks.filter((t) => t.date === iso);
        }, [tasks]);

        const jumpTo = (date, targetView = 'day') => {
          setAnchor(date);
          setView(targetView);
        };

        const handleMouseMove = (e) => {
          const width = window.innerWidth;
          const height = window.innerHeight;
          const normX = (e.clientX - width / 2) / (width / 2);
          const normY = (e.clientY - height / 2) / (height / 2);
          setMousePos({ x: normX, y: normY });
        };

        const handleMouseLeave = () => setMousePos({ x: 0, y: 0 });

        const reflectionX = Math.round(50 + mousePos.x * 25);
        const reflectionY = Math.round(35 + mousePos.y * 20);

        return (
          <div
            id="spatial-viewport"
            onMouseMove={handleMouseMove}
            onMouseLeave={handleMouseLeave}
            className={`relative min-h-screen w-full overflow-x-hidden flex flex-col items-center justify-start sm:justify-center p-2 sm:p-6 md:p-12 select-text transition-colors duration-700 ${
              isDay ? 'bg-[#c5d3e0]' : 'bg-[#0b0e11]'
            }`}
          >
            <SpatialBackground environment={currentEnv} blurAmount={blurAmount} />

            <div
              id="spatial-scene"
              className="relative z-10 w-full max-w-7xl mx-auto flex items-start justify-center py-2 sm:py-6 pb-6"
            >
              <div
                id="floating-planner-window"
                className={`relative transition-all duration-300 ease-out w-full ${
                  isMaximized ? 'max-w-6xl' : 'max-w-4xl'
                }`}
              >
                <AmbientLighting
                  environment={currentEnv}
                  mousePos={mousePos}
                  intensity={lightIntensity}
                />

                <div
                  className="relative rounded-2xl sm:rounded-3xl overflow-hidden backdrop-blur-2xl transition-all duration-500"
                  style={{
                    backgroundColor: isDay ? 'rgba(255, 255, 255, 0.62)' : 'rgba(15, 18, 22, 0.72)',
                    border: isDay ? '1px solid rgba(255, 255, 255, 0.78)' : '1px solid rgba(255, 255, 255, 0.20)',
                    boxShadow: isDay
                      ? `
                        0 20px 50px -10px rgba(15, 28, 48, 0.15),
                        inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.95)
                      `
                      : `
                        0 25px 60px -15px rgba(0, 0, 0, 0.75),
                        inset 0 1px 2px 0 rgba(255, 255, 255, 0.30)
                      `,
                  }}
                >
                  <div
                    className="absolute inset-0 pointer-events-none transition-opacity duration-300"
                    style={{
                      background: isDay
                        ? `radial-gradient(circle 700px at ${reflectionX}% ${reflectionY}%, rgba(255, 255, 255, 0.40) 0%, rgba(255, 255, 255, 0.06) 45%, transparent 75%)`
                        : `radial-gradient(circle 650px at ${reflectionX}% ${reflectionY}%, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.01) 40%, transparent 75%)`,
                    }}
                  />

                  <div className={`relative p-3.5 sm:p-8 md:p-10 transition-colors duration-200 ${isDay ? 'text-zinc-800' : 'text-[#ede7d8]'}`}>
                    {/* Header */}
                    <div className={`flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pb-3 sm:pb-5 mb-4 sm:mb-7 border-b ${isDay ? 'border-black/[0.08]' : 'border-white/10'}`}>
                      <div className="flex items-center justify-between sm:justify-start gap-3.5">
                        <div className="flex items-center gap-2">
                          <span className="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-rose-500/80 border border-rose-400/40" />
                          <span
                            className="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full border"
                            style={{
                              backgroundColor: accentColor,
                              borderColor: 'rgba(229, 164, 91, 0.5)',
                            }}
                          />
                          <span className="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-emerald-500/80 border border-emerald-400/40" />
                        </div>

                        <div className={`h-4 w-px mx-1 ${isDay ? 'bg-black/15' : 'bg-white/15'}`} />

                        <div className="flex items-center gap-2">
                          <span
                            className="text-2xl sm:text-4xl tracking-wide select-none transition-colors inline-flex items-baseline"
                            style={{ color: accentColor }}
                          >
                            <span style={{ fontFamily: "'royal-maison', 'Royal Maison', cursive, sans-serif" }}>D</span>
                            <span style={{ fontFamily: "'Halimun', 'halimun', cursive, sans-serif" }}>wmy</span>
                          </span>
                        </div>

                        <button
                          type="button"
                          onClick={toggleTheme}
                          className={`p-1.5 rounded-full transition-colors ml-auto sm:ml-2 ${
                            isDay ? 'bg-black/5 text-zinc-700 hover:bg-black/10' : 'bg-white/10 text-zinc-300 hover:bg-white/20'
                          }`}
                          title="切换主题模式"
                        >
                          {isDay ? <Moon size={14} /> : <Sun size={14} />}
                        </button>
                      </div>

                      {/* View selector */}
                      <div
                        className={`flex items-center justify-between sm:justify-center gap-1 p-1 rounded-full backdrop-blur-md transition-colors w-full sm:w-auto ${
                          isDay ? 'bg-black/[0.05]' : 'bg-zinc-800/50'
                        }`}
                      >
                        {['day', 'week', 'month', 'year'].map((v) => (
                          <button
                            key={v}
                            type="button"
                            onClick={() => setView(v)}
                            className={`flex-1 sm:flex-none px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-full text-[11px] sm:text-xs uppercase tracking-wider font-mono transition-all duration-200 cursor-pointer text-center ${
                              view === v
                                ? isDay
                                  ? 'bg-[#c97a2b]/15 text-[#c97a2b] font-medium shadow-sm'
                                  : 'bg-[#e5a45b]/15 text-[#e5a45b] font-medium shadow-sm'
                                : isDay
                                ? 'text-zinc-600 hover:text-zinc-950'
                                : 'text-zinc-400 hover:text-white'
                            }`}
                          >
                            {v === 'day' ? '日' : v === 'week' ? '周' : v === 'month' ? '月' : '年'}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* View rendering */}
                    {view === 'day' && (
                      <DayView
                        anchor={anchor}
                        tasksOn={tasksOn}
                        onAddTask={addTask}
                        onToggleTask={toggleTask}
                        onDeleteTask={deleteTask}
                      />
                    )}
                    {view === 'week' && (
                      <WeekView
                        anchor={anchor}
                        setAnchor={setAnchor}
                        tasksOn={tasksOn}
                        onToggleTask={toggleTask}
                        jumpToDay={(d) => jumpTo(d, 'day')}
                      />
                    )}
                    {view === 'month' && (
                      <MonthView
                        anchor={anchor}
                        setAnchor={setAnchor}
                        tasksOn={tasksOn}
                        jumpTo={(d) => jumpTo(d, 'day')}
                      />
                    )}
                    {view === 'year' && (
                      <YearView
                        anchor={anchor}
                        setAnchor={setAnchor}
                        tasksOn={tasksOn}
                        jumpTo={(d) => jumpTo(d, 'day')}
                        setView={setView}
                      />
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function App() {
        return (
          <ThemeProvider>
            <DwmyAppInner />
          </ThemeProvider>
        );
      }

      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
